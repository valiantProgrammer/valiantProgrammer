<svg width="450" height="200" viewBox="0 0 450 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: 700 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0366d6; }
    .label { font: 500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #586069; }
    .val { font: 700 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #24292e; }
  </style>
  <rect width="450" height="200" rx="10" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5" />
  <text x="30" y="38" class="title">Profile Stats</text>
  
  <g transform="translate(30, 65)">
    <circle cx="10" cy="10" r="4" fill="#28a745" />
    <text x="25" y="14" class="label">Public Repositories</text>
    <text x="360" y="14" class="val" text-anchor="end">34</text>

    <circle cx="10" cy="38" r="4" fill="#0366d6" />
    <text x="25" y="42" class="label">Total Stars Earned</text>
    <text x="360" y="42" class="val" text-anchor="end">7</text>

    <circle cx="10" cy="66" r="4" fill="#28a745" />
    <text x="25" y="70" class="label">Total Commits (2024-2026)</text>
    <text x="360" y="70" class="val" text-anchor="end">128</text>

    <circle cx="10" cy="94" r="4" fill="#0366d6" />
    <text x="25" y="98" class="label">Contributed Repositories</text>
    <text x="360" y="98" class="val" text-anchor="end">12</text>
  </g>
</svg>
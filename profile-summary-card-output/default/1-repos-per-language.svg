<svg width="450" height="200" viewBox="0 0 450 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: 700 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0366d6; }
    .label { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #24292e; }
    .bar-bg { fill: #e1e4e8; opacity: 0.25; }
  </style>
  <rect width="450" height="200" rx="10" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5" />
  <text x="30" y="38" class="title">Repositories per Language</text>

  <g transform="translate(30, 60)">
    <!-- Jupyter -->
    <text x="0" y="14" class="label">Jupyter (9)</text>
    <rect x="110" y="5" width="280" height="10" rx="5" class="bar-bg" />
    <rect x="110" y="5" width="250" height="10" rx="5" fill="#2ea44f" />

    <!-- JavaScript -->
    <text x="0" y="42" class="label">JavaScript (8)</text>
    <rect x="110" y="33" width="280" height="10" rx="5" class="bar-bg" />
    <rect x="110" y="33" width="222" height="10" rx="5" fill="#0969da" />

    <!-- Python -->
    <text x="0" y="70" class="label">Python (3)</text>
    <rect x="110" y="61" width="280" height="10" rx="5" class="bar-bg" />
    <rect x="110" y="61" width="83" height="10" rx="5" fill="#8250df" />

    <!-- TypeScript / Web -->
    <text x="0" y="98" class="label">TS / CSS (3)</text>
    <rect x="110" y="89" width="280" height="10" rx="5" class="bar-bg" />
    <rect x="110" y="89" width="83" height="10" rx="5" fill="#bf3989" />
  </g>
</svg>
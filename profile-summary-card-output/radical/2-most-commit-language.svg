<svg width="450" height="200" viewBox="0 0 450 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: 700 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #00FFD4; }
    .lang { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #a9fef7; }
    .pct { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #808080; }
  </style>
  <rect width="450" height="200" rx="10" fill="#0a0a0a" stroke="#00CED1" stroke-width="1.5" />
  <text x="30" y="38" class="title">Most Used Languages</text>

  <!-- Progress Bar Container -->
  <g transform="translate(30, 60)">
    <clipPath id="bar-clip-0a0a0a">
      <rect width="390" height="12" rx="6" />
    </clipPath>
    <g clip-path="url(#bar-clip-0a0a0a)">
      <rect x="0" y="0" width="160" height="12" fill="#00FFD4" />
      <rect x="160" y="0" width="125" height="12" fill="#00CED1" />
      <rect x="285" y="0" width="55" height="12" fill="#3b82f6" />
      <rect x="340" y="0" width="30" height="12" fill="#8b5cf6" />
      <rect x="370" y="0" width="20" height="12" fill="#ec4899" />
    </g>
  </g>

  <g transform="translate(30, 95)">
    <!-- Column 1 -->
    <circle cx="8" cy="8" r="4" fill="#00FFD4" />
    <text x="20" y="12" class="lang">Python <tspan class="pct">41.0%</tspan></text>

    <circle cx="8" cy="38" r="4" fill="#00CED1" />
    <text x="20" y="42" class="lang">JavaScript <tspan class="pct">32.0%</tspan></text>

    <circle cx="8" cy="68" r="4" fill="#3b82f6" />
    <text x="20" y="72" class="lang">Jupyter Notebook <tspan class="pct">14.1%</tspan></text>

    <!-- Column 2 -->
    <circle cx="210" cy="8" r="4" fill="#8b5cf6" />
    <text x="222" y="12" class="lang">TypeScript <tspan class="pct">7.7%</tspan></text>

    <circle cx="210" cy="38" r="4" fill="#ec4899" />
    <text x="222" y="42" class="lang">CSS / HTML <tspan class="pct">5.2%</tspan></text>
  </g>
</svg>
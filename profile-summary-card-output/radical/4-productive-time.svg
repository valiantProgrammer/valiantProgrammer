<svg width="450" height="200" viewBox="0 0 450 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: 700 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #00FFD4; }
    .label { font: 500 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #808080; }
    .slot { font: 600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #a9fef7; }
  </style>
  <rect width="450" height="200" rx="10" fill="#0a0a0a" stroke="#00CED1" stroke-width="1.5" />
  <text x="30" y="38" class="title">Productive Time (UTC+05:30)</text>

  <g transform="translate(30, 65)">
    <!-- Morning -->
    <text x="0" y="16" class="slot">Morning (06-12)</text>
    <rect x="140" y="6" width="220" height="12" rx="6" fill="#00CED1" opacity="0.2" />
    <rect x="140" y="6" width="60" height="12" rx="6" fill="#3b82f6" />
    <text x="375" y="16" class="label">18%</text>

    <!-- Afternoon -->
    <text x="0" y="44" class="slot">Afternoon (12-18)</text>
    <rect x="140" y="34" width="220" height="12" rx="6" fill="#00CED1" opacity="0.2" />
    <rect x="140" y="34" width="110" height="12" rx="6" fill="#00CED1" />
    <text x="375" y="44" class="label">32%</text>

    <!-- Evening / Night -->
    <text x="0" y="72" class="slot">Evening (18-24)</text>
    <rect x="140" y="62" width="220" height="12" rx="6" fill="#00CED1" opacity="0.2" />
    <rect x="140" y="62" width="170" height="12" rx="6" fill="#00FFD4" />
    <text x="375" y="72" class="label">50%</text>

    <text x="0" y="105" class="label">Most active between 18:00 - 01:00 IST</text>
  </g>
</svg>